project:
  type: website
  output-dir: docs

website:
  title: "SPEAK Lab"
  favicon: /Images/favicon/favicon-96x96.png
  navbar:
    title: " 
  ![](/Images/Logo.png){width=45}
  \\ \\
  SPEAK Lab"
    right:
      - text: "Home"
        href: index.qmd
      - text: "Team"
        href: team.qmd
      - text: "Research"
        href: research/index.qmd
      - text: "Blog"
        href: blog.qmd
  page-footer: 
    left: "" 
    right: 
      - icon: github
        href: https://github.com/
      - icon: instagram 
        href: https://www.instagram.com/speaklaboratory/
        
        
# Define a collection named "Posts"
collections:
  Posts:
    title: "Blog"
    # The pattern must match the folder and file extension
    pattern: "posts/*.qmd"
    sort: "date desc"

format:
  html:
    theme: 
      light:
        - cosmo
        - styles/cosmo-custom.scss
      dark:
        - solar
        - styles/solar-custom.scss
    css: /styles.css
    toc: true
    metadata:
      pagetitle: "SPEAK Lab"

editor: visual

