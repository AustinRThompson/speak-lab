name: Build project updates JSON

on:
  push:
    paths:
      - "_publish/logs/**/*.md"
      - "scripts/build-project-updates.js"
      - "package.json"

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build JSON
        run: npm run build-updates

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/project-updates.json
          git diff --cached --quiet || git commit -m "Update project-updates.json"
          git push
